<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student View - Skyrise</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container" id="login-container">
    <div class="form-container">
      <h1>🏙️ Skyrise</h1>
      <div id="error-message" class="error-message" style="display: none;"></div>
      
      <div class="form-group">
        <label for="room-code">Room Code</label>
        <input type="text" id="room-code" placeholder="Enter 6-digit code" maxlength="6" style="text-transform: uppercase;">
      </div>
      
      <div class="form-group">
        <label for="student-name">Your Name</label>
        <input type="text" id="student-name" placeholder="Enter your name" maxlength="50">
      </div>
      
      <button class="btn" onclick="joinRoom()">Join Room</button>
    </div>
  </div>

  <div class="container" id="student-container" style="display: none;">
    <div class="header">
      <h1>
        <span id="connection-indicator" class="connection-status connecting"></span>
        🏙️ <span id="student-name-display"></span>
      </h1>
      <div class="room-code" id="room-code-display"></div>
    </div>

    <div style="max-width: 800px; margin: 0 auto;">
      <div class="progress-indicator">
        <div class="progress-text">
          Level <span id="current-level">1</span> of <span id="total-levels">10</span>
        </div>
      </div>

      <div class="level-info" id="level-info">
        <div class="level-title" id="level-title">Loading...</div>
        <div class="level-description" id="level-description"></div>
        <div class="assignment-text" id="assignment-text">
          Waiting for assignment...
        </div>
      </div>

      <div class="inventory-display" id="inventory-container" style="display: none;">
        <div class="inventory-title">🎒 My Rewards</div>
        <div class="inventory-items" id="inventory-items"></div>
      </div>

      <div style="text-align: center; color: #666; padding: 20px; background: white; border-radius: 8px;">
        💡 Complete the assignment above, then ask your teacher to mark it as complete!
      </div>
    </div>
  </div>

  <script src="/js/student-client.js"></script>
</body>
</html>
