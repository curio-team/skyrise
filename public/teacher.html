<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard - Skyrise</title>
  <link rel="stylesheet"
        href="/css/styles.css">
</head>

<body>
  <div class="container"
       id="login-container">
    <div class="form-container">
      <h1>🏙️ Skyrise - Teacher Dashboard</h1>
      <div id="error-message"
           class="error-message"
           style="display: none;"></div>

      <div class="form-group">
        <label for="room-code">Teacher Code</label>
        <input class="input"
               id="teacher-code-input"
               type="password"
               placeholder="Enter teacher code"
               onkeydown="if(event.key==='Enter') createRoom()" />
      </div>

      <button class="btn"
              onclick="createRoom()">Create New Room</button>

      <div class="rooms-section"
           id="rooms-section">
        <div class="rooms-section-header">
          <span>Active Rooms</span>
          <button class="btn-link"
                  onclick="loadRooms()">↻ Refresh</button>
        </div>
        <div class="rooms-list"
             id="rooms-list">
          <p class="rooms-empty">Enter your teacher code above to see active rooms.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="container"
       id="dashboard-container"
       style="display: none;">
    <div class="header">
      <h1>
        <span id="connection-indicator"
              class="connection-status connecting"></span>
        🏙️ Skyrise
      </h1>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div class="room-code"
             id="room-code-display"></div>
        <button class="btn-leave"
                onclick="leaveRoom()">&#8592; Leave</button>
      </div>
    </div>

    <div class="main-content">
      <div class="skyline-section">
        <h2>City Skyline</h2>
        <canvas id="skyline-canvas"></canvas>
      </div>

      <div class="sidebar">
        <div class="students-panel">
          <h3>Students (<span id="student-count">0</span>)</h3>
          <div class="student-list"
               id="student-list">
            <p style="color: var(--text-muted); text-align: center; padding: 20px; font-size: 0.9em;">No students yet</p>
          </div>
        </div>

        <div class="controls-panel">
          <h3>Controls</h3>
          <div id="no-selection"
               style="color: var(--text-muted); text-align: center; padding: 20px; font-size: 0.9em;">
            Select a student
          </div>
          <div id="student-controls"
               style="display: none;">
            <div style="margin-bottom: 14px;">
              <strong id="selected-student-name"
                      style="color: var(--text-primary);"></strong>
              <div class="selected-student-meta">
                Level: <span id="selected-student-level"></span>
              </div>
            </div>
            <button class="btn btn-secondary"
                    id="complete-level-btn"
                    onclick="completeLevel()">
              Complete Current Level
            </button>
            <div id="selected-student-inventory"
                 class="inventory-display"
                 style="display: none;">
              <div class="inventory-title">Inventory</div>
              <div class="inventory-items"
                   id="selected-inventory-items"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/skyline-renderer.js"></script>
  <script src="/js/teacher-client.js"></script>
</body>

</html>
